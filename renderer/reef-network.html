<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE REEF — SOCIAL NETWORK</title>
  <link rel="stylesheet" href="inspector.css">
  <style>
    .reef-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .reef-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .reef-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .reef-url {
      flex: 1;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
    .reef-frame-container {
      flex: 1;
      overflow: hidden;
      background: #fff;
    }
    .reef-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .reef-status {
      padding: 6px 16px;
      font-size: 10px;
      color: var(--text-dim);
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .reef-status.connected { color: var(--accent); }
    .reef-status.error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="reef-shell">
    <div class="reef-header">
      <span class="reef-title">🌊 THE REEF</span>
      <span class="reef-url" id="reefUrl">—</span>
      <button class="insp-btn" id="refreshBtn">⟳ REFRESH</button>
      <button class="insp-btn" id="openExternal">↗ BROWSER</button>
    </div>
    <div class="reef-frame-container" id="frameContainer">
      <iframe id="reefFrame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
    </div>
    <div class="reef-status" id="statusBar">connecting…</div>
  </div>
  <script src="reef-network.js"></script>
</body>
</html>
